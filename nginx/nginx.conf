worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Adjust log paths to match your nginx install location
    access_log  C:/Apps/nginx/logs/access.log;
    error_log   C:/Apps/nginx/logs/error.log  warn;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;

    server {
        # Use 8080 if IIS already owns port 80
        # (also update FRONTEND_URL to http://199.1.1.32:8080)
        listen       80;
        server_name  _;

        # ── Static frontend (React SPA) ───────────────────────────────────────
        # Always use forward slashes in nginx paths — backslashes cause parse errors
        root   E:/Apps/lhb-mms/frontend/dist;
        index  index.html;

        # SPA fallback: React Router requires this — without it, page refresh = 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed Vite assets forever (content hash changes on each build)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── API proxy → Node backend ──────────────────────────────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Off prevents partial responses on the day-end file download endpoint
            proxy_buffering    off;
            proxy_read_timeout 120s;
        }
    }
}
